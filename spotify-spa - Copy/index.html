<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicMixer </title>
  <link rel="stylesheet" href="UI.css" />
  <link rel="icon" href="assets/logo.jpg" type="image/png">
</head>
<body>
<div id="loadingScreen" class="loading-screen">
  <div class="loading-content">
    <img src="assets/logo-removebg-preview.png" alt="MusicMixer Logo" class="loading-logo">
    <h1 class="loading-title">MusicMixer</h1>
    <p class="loading-subtitle">Made by Augvxst</p>
    <div class="loading-spinner"></div>
    
    <div id="loginForm" class="login-form hidden">
      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active">Log in</button>
        <button id="signupTab" class="auth-tab">Sign up</button>
      </div>
      
      <div id="loginPanel" class="auth-panel">
        <div class="input-group">
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>
        <div id="loginError" class="error-message"></div>
        <button id="loginBtn" class="auth-btn">Log in</button>
      </div>
      
      <div id="signupPanel" class="auth-panel hidden">
        <div class="input-group">
          <input type="text" id="signupUsername" placeholder="Username" autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password">
        </div>
        <div class="input-group">
          <input type="password" id="signupConfirm" placeholder="Confirm Password" autocomplete="new-password">
        </div>
        <div id="signupError" class="error-message"></div>
        <button id="signupBtn" class="auth-btn">Sign up</button>
      </div>
    </div>
  </div>
</div>

<div class="leftbar">
  <h1>
    <img src="assets/logo-removebg-preview.png" alt="logo" style="width:100px;height:100px;">
    <p>MusicMixer</p>
  </h1>
  <ul>
  </ul>


  <div class="playlist-list" id="playlistList"></div>
   
  <div class="sidebar-buttons">
    <button id="newPlaylistBtn">+ New Playlist</button>
    <button id="openmenubtn">Upload</button>
     <button id="statsBtn">Stats</button>
  </div>
</div>


<div id="statspopup" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Your Stats</h2>
      <button id="closestatsbtn" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div id="statsContent"></div>
    </div>
  </div>
</div>

<div id="uploadpopup" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Upload Your Song</h2>
      <button id="closemenubtn" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Song Name</label>
        <input id="songNameInput" type="text" placeholder="Enter song name">
      </div>
      <div class="form-group">
        <label>Audio File</label>
        <input id="songFileInput" type="file" accept="audio/*">
      </div>
      <div class="form-group">
        <label>Cover Image</label>
        <input id="songImageInput" type="file" accept="image/*">
      </div>
      <div class="form-group">
        <label>Playlist</label>
        <select id="playlistSelect"></select>
      </div>
      <div class="modal-footer">
        <button id="addSongBtn" class="btn-primary">Add Song</button>
      </div>
    </div>
  </div>
</div>

<div id="newPlaylistPopup" class="modal-overlay hidden">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2>Create New Playlist</h2>
      <button id="closeNewPlaylistBtn" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Playlist Name</label>
        <input id="newPlaylistInput" type="text" placeholder="Enter playlist name" autocomplete="off">
      </div>
      <div class="modal-footer">
        <button id="cancelNewPlaylistBtn" class="btn-secondary">Cancel</button>
        <button id="createPlaylistBtn" class="btn-primary">Create Playlist</button>
      </div>
    </div>
  </div>
</div>

<div id="renamePlaylistPopup" class="modal-overlay hidden">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2>Rename Playlist</h2>
      <button id="closeRenamePlaylistBtn" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Playlist Name</label>
        <input id="renamePlaylistInput" type="text" placeholder="Enter new name" autocomplete="off">
      </div>
      <div class="modal-footer">
        <button id="cancelRenamePlaylistBtn" class="btn-secondary">Cancel</button>
        <button id="saveRenamePlaylistBtn" class="btn-primary">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<div id="deleteConfirmPopup" class="modal-overlay hidden">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2>Delete Playlist</h2>
      <button type="button" id="closeDeleteConfirmBtn" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <p style="margin: 0 0 24px 0; font-size: 1.1em; color: #e0e0e0;">Are you sure? This will delete the playlist and all its songs.</p>
      <div class="modal-footer">
        <button type="button" id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn-delete">Delete</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

  <div class="main">
    <div class="song-list">
      <input type="text" id="searchInput" placeholder="Search songs..." class="search-bar">
      <div id="songListContainer"></div>
    </div>

    <div class="user">
      <img src="album.jpg" alt="Album Art" class="user-photo" />
      <h2 id="title">Choose a Song</h2>
      <audio id="audio"></audio>
      <div class="player-controls">
        <div class="progress-container">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
          <span id="duration">0:00</span>
        </div>
        <div class="volume-container">
          <label>🔊</label>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
        </div>
      </div>
      <div class="buttons">
        <button id="prev">⏮</button>
        <button id="play">▶</button>
        <button id="next">⏭</button>
      </div>
      <div id="queueView" class="queue-view">
        <h3>Next Up</h3>
        <div id="queueList"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
